version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kite_postgres
    restart: always
    environment:
      POSTGRES_USER: kite_user
      POSTGRES_PASSWORD: kite_secure_password_2026
      POSTGRES_DB: kite_attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kite_user -d kite_attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kite_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://kite_user:kite_secure_password_2026@postgres:5432/kite_attendance_db?schema=public"
      JWT_SECRET: "kite_attendance_super_secret_jwt_key_2026_dev_secure"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kite_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
